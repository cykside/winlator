name: Build Winlator APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed only to publish a GitHub Release on tag pushes

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (without submodules first)
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true
          fetch-depth: 1

      - name: Initialize submodules (app, vortek, gladio)
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 \
            || git submodule update --init --recursive

      - name: Verify submodules are populated
        run: |
          git submodule status
          if [ -z "$(ls -A app 2>/dev/null)" ]; then
            echo "::error::The 'app' submodule is empty or unreachable."
            echo "::error::If its upstream repository is private or removed, fork it and update the url in .gitmodules."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Locate Gradle project directory
        id: proj
        run: |
          WRAPPER=$(find . -maxdepth 3 -name gradlew -not -path "./.git/*" | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$WRAPPER" ]; then
            if [ -n "$(find . -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts \) -not -path './.git/*' | head -1)" ]; then
              DIR=$(dirname "$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -1)")
              echo "::warning::gradlew not found, falling back to the system Gradle in $DIR"
              echo "dir=$DIR" >> "$GITHUB_OUTPUT"
              echo "wrapper=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No Gradle project found."
            ls -la; ls -la app || true
            exit 1
          fi
          DIR=$(dirname "$WRAPPER")
          echo "Gradle project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "wrapper=true" >> "$GITHUB_OUTPUT"

      # The runner image already ships with the Android SDK (ANDROID_HOME).
      # This step reads the requirements from build.gradle and installs them.
      # Every command here is non-fatal because the Android Gradle Plugin can
      # also download missing packages once the licenses are accepted.
      - name: Prepare Android SDK, NDK and CMake
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found, relying on Gradle auto-download"
            exit 0
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          FILES=$(find . -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts \))
          COMPILE_SDK=$(grep -hoE 'compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+' $FILES 2>/dev/null | grep -oE '[0-9]+$' | sort -n | tail -1 || true)
          BUILD_TOOLS=$(grep -h 'buildToolsVersion' $FILES 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          NDK=$(grep -h 'ndkVersion' $FILES 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)

          COMPILE_SDK=${COMPILE_SDK:-34}
          BUILD_TOOLS=${BUILD_TOOLS:-34.0.0}
          echo "Detected: compileSdk=$COMPILE_SDK buildTools=$BUILD_TOOLS ndk=${NDK:-default}"

          PACKAGES=("platforms;android-$COMPILE_SDK" "build-tools;$BUILD_TOOLS" "cmake;3.22.1")
          if [ -n "$NDK" ]; then PACKAGES+=("ndk;$NDK"); fi

          for PKG in "${PACKAGES[@]}"; do
            "$SDKMANAGER" --install "$PKG" || echo "::warning::Could not install $PKG, Gradle will try to download it"
          done

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ "${{ steps.proj.outputs.wrapper }}" = "true" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: List built APKs
        run: find . -name "*.apk" -path "*build/outputs*" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-debug-${{ github.sha }}
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/build/outputs/apk/**/*.apk
