name: Build Winlator APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (including app, vortek and gladio submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Fallback in case Gradle does not download the NDK/CMake automatically.
      # Match these versions to ndkVersion / cmake version in the project's build.gradle.
      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "platforms;android-33" "build-tools;33.0.2"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Gradle project directory
        id: proj
        run: |
          if [ -f app/gradlew ]; then
            echo "dir=app" >> "$GITHUB_OUTPUT"
          elif [ -f gradlew ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "gradlew not found"; ls -la; ls -la app || true
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
